services:
  - type: web
    name: ai-agent
    env: docker
    region: singapore
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          name: redis
          type: redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: 10
      - key: DAILY_BUDGET_USD
        value: 10.0
      - key: MONTHLY_BUDGET_USD
        value: 100.0

  - type: redis
    name: redis
    plan: free
    ipAllowList: []
